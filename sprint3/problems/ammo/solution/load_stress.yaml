phantom:
  address: 127.0.0.1:8080
  ammofile: ammo.txt
  load_profile:
    load_type: rps
    schedule: const(100000, 60s)  # 100000 RPS в течение 60 секунд
  uris:
    - /
  headers:
    - "[Host: localhost]"
  connection_test: false
  writelog: error
  ammo_type: uri
autostop:
  autostop:
    - http(5xx,50%,5s)  # Остановка при 50% ошибок 5xx за 5 секунд
console:
  enabled: true
telegraf:
  enabled: false
overload:
  enabled: false
