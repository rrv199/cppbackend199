name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      
      - name: Build state_serialization
        run: |
          cd sprint4/problems/state_serialization
          docker build -t state_serialization:latest .
          
      - name: Run tests
        run: |
          cd sprint4/problems/state_serialization
          docker run --rm state_serialization:latest -s
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            *.xml
            *.log
