name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-sync-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Install Conan
        run: |
          pip install conan
          conan profile detect
      
      - name: Build sync_server
        run: |
          cd sprint1/problems/sync_server/solution
          mkdir -p build
          cd build
          conan install .. --build=missing
          cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake
          cmake --build . -j $(nproc)
      
      - name: Run sync_server tests
        run: |
          # Добавьте тесты если есть
          echo "Tests passed"
